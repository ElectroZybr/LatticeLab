[keybinds]
quit = "Ctrl+Q"
forward = ["W", "hold"]
backward = ["S", "hold"]
left = ["A", "hold"]
right = ["D", "hold"]
up = ["E", "hold"]
down = ["Q", "hold"]
look = ["MouseDelta+MouseRight", "axis2"]
pan = ["MouseDelta+MouseMiddle", "axis2"]
zoom = ["MouseWheel", "axis"]
cursor = ["MousePos", "axis2"]
